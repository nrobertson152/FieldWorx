# SPDX-License-Identifier: GPL-3.0-or-later
# Every push and pull request: the bridge against real RevisionWorx and OpenMeridian, the Dart core against the
# shared protocol vectors, the two end to end (tools/interop.sh), and the app (analysis, widget tests, an Android
# build and an iOS build). Nothing here signs, tags or publishes anything: releases are the Director's.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"
  # Sibling programs, reached only through their documented command lines (never imported by FieldWorx itself).
  REVISIONWORX: "revisionworx @ git+https://github.com/nrobertson152/revisionworx"
  OPENMERIDIAN: "openmeridian @ git+https://github.com/nrobertson152/openmeridian"

jobs:
  bridge:
    name: Bridge (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the bridge, RevisionWorx and OpenMeridian
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest "$REVISIONWORX" "$OPENMERIDIAN" -e bridge
      - name: Tests (including packs built through RevisionWorx's command line)
        run: python -m pytest bridge -q -ra
      - name: Protocol vectors are up to date
        run: python spec/make_vectors.py --check

  core:
    name: Dart core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 120 lib bin test || echo "::notice::dart format would change files"
      - run: dart analyze --fatal-infos
      - run: dart test

  interop:
    name: Bridge ⇄ core end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install RevisionWorx and OpenMeridian
        run: python -m pip install "$REVISIONWORX" "$OPENMERIDIAN"
      - run: (cd core && dart pub get)
      - run: bash tools/interop.sh
      - name: The demo package in the app verifies
        run: |
          (cd core && dart run bin/fxtool.dart verify ../app/assets/demo/demo.fieldworx)
          PYTHONPATH=bridge python -m fieldworx_bridge verify app/assets/demo/demo.fieldworx

  app:
    name: App (analyze, widget tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Keep the resolved versions (commit app/pubspec.lock when it changes)
        uses: actions/upload-artifact@v4
        with:
          name: pubspec-lock
          path: app/pubspec.lock
      - run: flutter analyze
      - name: Widget tests (the real store and the demo package; fake camera, viewer and share sheet)
        run: flutter test --reporter expanded

  android:
    name: App (Android build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android build (an APK signed with the debug key, for testing; not a release)
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fieldworx-apk-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - name: The release APK asks for no network access
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt"
          "$aapt" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "::error::the release APK requests INTERNET"; exit 1; fi

  ios:
    name: App (iOS build, no signing)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
